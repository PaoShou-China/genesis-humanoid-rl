[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-humanoid-rl"
version = "0.1.0.dev0"
description = "Reproducible G1 standing and locomotion experiments on GenesisLab"
requires-python = ">=3.10,<3.14"
dependencies = [
  "genesislab[rl] @ git+https://github.com/genesislab-project/GenesisLab.git@e06f383af31773fc748b1a72b5268bd84b26eb2a",
  "genesis-world==1.3.3",
  "rsl-rl-lib==5.4.1",
  "PyYAML>=6,<7",
  "imageio-ffmpeg>=0.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["humanoid*", "algorithms*", "evaluation*", "visualization*", "configs*"]

[tool.setuptools.package-data]
configs = ["robots/*.yaml", "tasks/*.yaml", "algorithms/*.yaml", "experiments/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["simulation: real Genesis physics (requires robot assets)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
